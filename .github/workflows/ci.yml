name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4

      # The runner's own PHP, not DDEV: the plugin has no database or service to stand up.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # composer.lock is not committed (a library); config.platform.php holds resolution at 8.2.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-plugins

      - name: ECS, PHPStan and the unit suite
        run: composer check

  # Repo hygiene runs once: it reads files, not PHP.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Profile V6.
      - name: No en or em dashes
        run: |
          if LC_ALL=C grep -rn -e $'\xe2\x80\x93' -e $'\xe2\x80\x94' src tests docs README.md CHANGELOG.md; then
            echo "::error::En or em dashes found; use a hyphen, colon, comma or parentheses."
            exit 1
          fi

      # BR-31: both disclaimers stay in the README.
      - name: README disclaimers
        run: |
          grep -qi 'not affiliated with' README.md
          grep -qi 'Usercentrics' README.md
          grep -qi 'does not guarantee' README.md
