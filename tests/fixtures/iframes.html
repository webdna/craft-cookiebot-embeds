<!DOCTYPE html>
<html lang="en">
<head>
    <title>Iframes</title>
</head>
<body>
    <h1>Embeds</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/abc123" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay" allowfullscreen></iframe>
    <p>Vimeo, protocol-relative:</p>
    <iframe src="//player.vimeo.com/video/123456?dnt=1" width="640" height="360"></iframe>
    <iframe SRC='https://www.google.com/maps/embed?pb=!1m18' style="border:0;" loading="lazy"></iframe>
    <iframe src="https://widgets.example-unlisted.org/frame" data-id=42></iframe>
    <iframe src="https://evil.example.net/a" src="https://evil.example.net/b"></iframe>
    <iframe src="https://www.example.com/form/embed"></iframe>
    <iframe src="/local/embed"></iframe>
    <iframe src="https://widgets.example.org/booking"></iframe>
    <iframe src="https://www.youtube.com/embed/abc&amp;rel=0" width="100%"></iframe>
    <iframe></iframe>
    <iframe src=""></iframe>
    <iframe src="about:blank"></iframe>
    <iframe srcdoc="<p>Hello</p>" src="https://www.youtube.com/embed/abc123"></iframe>
</body>
</html>
