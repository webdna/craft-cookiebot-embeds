<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body x-data="{ open: false, url: '' }" @keydown.escape.window="open = false">
    <div x-data="video" @click.outside="open = false" :class="{ 'is-open': open }">
        <iframe :src="url" x-bind:title="title" src="https://www.youtube.com/embed/abc123" @load="loaded = true" x-on:error='failed = true' width="560" height="315"></iframe>
        <iframe :src="url" x-show="open"></iframe>
    </div>
    <template x-if="open">
        <iframe src="https://player.vimeo.com/video/123456" x-transition.opacity></iframe>
    </template>
    <button type="button" @click="open = !open" x-text="open ? 'Close' : 'Open'"></button>
    <script x-on:load="ready()" src="https://cdn.example-unlisted.org/widget.js" @error='fail()' :data-x="y"></script>
</body>
</html>
